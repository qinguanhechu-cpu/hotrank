<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全网热榜聚合</title>
<style>
  :root { --blue:#2563eb; --bg:#f5f6f8; --card:#fff; --tx:#1f2329; --tx2:#8a919f; --line:#e8eaf0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:16px 12px 60px; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; }
  .meta { color:var(--tx2); font-size:12px; margin-top:2px; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 10px; }
  .tab { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 14px;
         cursor:pointer; font-size:13px; user-select:none; color:var(--tx2); }
  .tab.on { color:#fff; background:var(--blue); border-color:var(--blue); font-weight:600; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; }
  .row { display:flex; align-items:baseline; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; }
  .rk { width:26px; text-align:center; font-weight:700; color:var(--tx2); flex:none; }
  .rk.top1 { color:#e5484d; } .rk.top2 { color:#f76b15; } .rk.top3 { color:#ffb224; }
  .tt { flex:1; color:var(--tx); text-decoration:none; }
  .tt:hover { color:var(--blue); }
  .hot { flex:none; color:var(--tx2); font-size:12px; }
  .empty { color:var(--tx2); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>全网热榜聚合</h1>
    <div class="meta" id="meta">加载中…</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
const ORDER = ["weibo", "douyin", "bili", "baidu", "toutiao"];
let DATA = null, CUR = null;

function fmtHot(v) {
  v = Number(v) || 0;
  if (!v) return "";
  if (v >= 100000000) return (v / 100000000).toFixed(1) + "亿";
  if (v >= 10000) return (v / 10000).toFixed(1) + "万";
  return String(v);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function render() {
  const plats = (DATA && DATA.platforms) || {};
  const keys = ORDER.filter(k => plats[k] && plats[k].items && plats[k].items.length);
  if (!keys.length) {
    document.getElementById("panel").innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  if (!CUR || !plats[CUR]) CUR = keys[0];
  document.getElementById("tabs").innerHTML = keys.map(k =>
    '<span class="tab' + (k === CUR ? " on" : "") + '" data-k="' + k + '">' +
    esc(plats[k].label) + ' · ' + plats[k].items.length + '</span>').join("");
  document.getElementById("meta").textContent =
    "生成于 " + (DATA.generated_at || "?") + " · " +
    keys.map(k => plats[k].label + " " + (plats[k].updated_at || "").slice(11, 16)).join(" · ");
  const p = plats[CUR];
  document.getElementById("panel").innerHTML = p.items.map(it => {
    const rk = it.rank <= 3 ? " top" + it.rank : "";
    return '<div class="row"><span class="rk' + rk + '">' + it.rank + '</span>' +
      '<a class="tt" target="_blank" rel="noopener" href="' + esc(it.url || "#") + '">' +
      esc(it.title) + '</a><span class="hot">' + fmtHot(it.hot) + '</span></div>';
  }).join("");
}
document.getElementById("tabs").addEventListener("click", e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (k) { CUR = k; render(); }
});
fetch("hot.json?ts=" + Date.now()).then(r => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById("meta").textContent = "hot.json 加载失败：" + err.message;
  });
</script>
</body>
</html>

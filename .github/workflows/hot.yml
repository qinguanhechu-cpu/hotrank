name: update-hot

on:
  schedule:
    - cron: "7 */2 * * *"   # 每 2 小时抓一次公开热榜（无需任何 cookie/secret）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hot lists
        run: python3 fetch_hot.py

      - name: Commit hot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "hot: $(date +%F-%H%M)"
            git push
          fi

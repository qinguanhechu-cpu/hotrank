name: update-data

on:
  schedule:
    - cron: "0 0,7,14 * * *"   # 北京时间 8:00 / 15:00 / 22:00 各更新一次
  workflow_dispatch:        # 手动触发按钮，方便测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rank data
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python3 fetch_json.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date +%F)"
            git push
          fi

name: update-data

on:
  schedule:
    - cron: "10 14 * * *"   # 兜底：北京时间 22:10 触发（实际常延迟到 0 点后执行）。白天 8:10 / 15:10 由本机定时任务负责
  workflow_dispatch:        # 手动触发按钮，方便测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rank data
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python3 fetch_json.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date +%F)"
            git push
          fi
